<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <script
        type="text/paperscript" 
        canvas="splatterPaint"
        src="script.js"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>


    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-page">
        <div id="flowers"></div>
        <h1>Splatter Paint!</h1>
        <button id="start-btn" onclick="startPainting()">start painting</button>
    </div>
    <canvas id="splatterPaint" resize></canvas> <!-- u can draw stuff on a canvas :o-->
    <button id="clear-btn" onclick="clearCanvas()">clear</button> <!--by putting it here the button is ono the canvas screen(not home page)-->
    <!--lol all my js :D -->
    <script> 
        function startPainting() {
            document.getElementById("start-page").style.display = "none";
            document.getElementById("splatterPaint").style.visibility = "visible";
        }
        const flowerImages = [
            "blue-flower.png",
            "pink-flower.png",
            "purple-flower.png"
        ];
        
        function createFlowers() {
        /* 1. make container 2. x15: create img, pick random flower, position, speed, then add 2 page */
            const container = document.getElementById("flowers");
            for (let i = 0; i < 15; i++) { // basically for i in range(15)
                const flower = document.createElement("img"); //creates img each time(where the source is the flower)
                flower.src = //basically randomly picks a flower from the list 
                    flowerImages[Math.floor /*rounds down*/ (Math.random() /* # btwn 0 + not quite 1 */ * flowerImages.length)]; 
                flower.classList.add("flower"); //adds to class(so i can do css stuff)
                flower.style.left =
                    Math.random() * 100 + "vw"; // random horizontal position(100 is 100% of L / R);
                flower.style.animationDuration = 2.5 + Math.random() * 4 + "s"; // some falls faster
                flower.style.animationDelay = Math.random() * 8 + "s"; //starting at random times(not all @ 0)
                container.appendChild(flower);
            }
                
        }
        createFlowers() 

        function clearCanvas() {
           location.reload();
}
    </script>
</body> 
</html>
